// Módulo local do Expo (impressora Sunmi do Smart POS P2).
// O expo-module-gradle-plugin configura android library, Kotlin, KSP e coloca
// o expo-modules-core no classpath (compileOnly).
apply plugin: 'expo-module-gradle-plugin'

group = 'com.dombars.smart2printer'
version = '0.1.0'

expoModule {
  // Módulo local do app — não é publicado como artefato Maven. Desligar a
  // publicação evita o caminho do plugin que chama components.getByName("release")
  // e falha ao configurar :expo com "SoftwareComponent with name 'release' not found".
  canBePublished = false
}

android {
  namespace = "com.dombars.smart2printer"
}

dependencies {
  // Biblioteca oficial da impressora Sunmi (Smart POS P2 = Sunmi P2).
  implementation 'com.sunmi:printerlibrary:1.0.18'
}
