// Módulo local do Expo: o `expo-module-gradle-plugin` configura o android library,
// o Kotlin, o KSP e — o essencial — coloca o `expo-modules-core` no classpath
// (era isso que faltava: as classes expo.modules.* não eram encontradas no build).
apply plugin: 'expo-module-gradle-plugin'

group = 'com.dombars.smart2printer'
version = '0.1.0'

android {
  namespace = "com.dombars.smart2printer"

  // O autolinking do Expo publica cada módulo pelo componente "release".
  // Sem declarar a variante, o Gradle falha com
  // "SoftwareComponent with name 'release' not found" ao configurar :expo.
  publishing {
    singleVariant("release")
  }
}

dependencies {
  // Biblioteca oficial da impressora Sunmi (Smart POS P2 = Sunmi P2).
  implementation 'com.sunmi:printerlibrary:1.0.18'
}
